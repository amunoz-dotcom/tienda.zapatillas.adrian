<form id="checkout-form" class="checkout-form">
    <h2 class="checkout-title">Preferencias de tu pedido</h2>
    <p class="checkout-intro">Personaliza los detalles de tu compra.</p>
    <div class="checkout-fields">
        <label for="campo_regalo">Regalo por compra</label>
        <select id="campo_regalo" name="regaloPromocional">
            <option value="Spray protector de zapatillas">Spray protector impermeable</option>
            <option value="Kit de limpieza de zapatillas">Kit de limpieza express</option>
            <option value="Cordones extra (Blancos y Negros)">Set de cordones extra</option>
        </select>
        <label for="campo_embalaje">Tipo de embalaje</label>
        <select id="campo_embalaje" name="tipoEmbalaje">
            <option value="Caja doble reforzada para coleccionistas">Caja doble reforzada (coleccionistas)</option>
            <option value="Embalaje ecológico sin plástico">Embalaje ecológico sin plástico</option>
        </select>
        <label for="campo_talla_calcetines">Talla de calcetines de regalo</label>
        <select id="campo_talla_calcetines" name="tallaCalcetinesRegalo">
            <option value="S (35-38)">S (35-38)</option>
            <option value="M (39-42)">M (39-42)</option>
            <option value="L (43-46)">L (43-46)</option>
        </select>
    </div>
    <p class="checkout-error" role="alert" hidden></p>
    <div class="checkout-actions">
        <button type="button" class="checkout-button checkout-button--secondary" id="checkout-back-payment">Volver al pago</button>
        <button type="submit" class="checkout-button" id="aceptar_paso_preferencias">Revisar pedido</button>
    </div>
</form>
