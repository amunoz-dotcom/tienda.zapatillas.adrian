<div class="product-grid">
    {{#.}}
    <div class="product-card">
        <div>CATÉGORIE : {{CATEGORIA}}</div>
        <strong>MODÈLE : {{MODELO}}</strong>
        <img class="imagen-producto" src="mostrar_miniatura?id={{ID}}" alt="Image de {{MODELO}}" loading="lazy" />
        <div>MARQUE : {{MARCA}}</div>
        <div>PRIX : {{PRECIO}} €</div>
        <div>COULEUR : {{COLOR}}</div>
        <div>POINTURE : {{TALLA}}</div>
        {{#DESCRIPCION}}
        <div>DESCRIPTION : {{DESCRIPCION}}</div>
        {{/DESCRIPCION}}
        {{#SKU}}
        <div>SKU : {{SKU}}</div>
        {{/SKU}}
        <a href="#" class="btn-details" onclick="mostrar_detalles({{ID}}); return false;">VOIR LES DÉTAILS</a>
        <div style="margin-top: 6px;">
            <label>QUANTITÉ :</label>
            <input type="number" value="1" min="1">
        </div>
        <a href="#" class="btn-cart" onclick="agregarProductoCarrito({{ID}}, this.closest('.product-card').querySelector('input[type=number]').value); return false;">AJOUTER AU PANIER</a>
    </div>
    {{/.}}
</div>
