<article class="product-detail-card">
    <div class="product-detail-category">CATÉGORIE : {{CATEGORIA}}</div>
    <h2>MODÈLE : {{MODELO}}</h2>
    <div class="product-detail-image">
        <img class="imagen-producto product-detail-image__main" src="mostrar_imagen?id={{ID}}" alt="Image de {{MODELO}}" />
    </div>
    <div class="product-detail-gallery" role="group" aria-label="Galerie d’images">
        {{#IMAGENES}}
        <button type="button" class="product-detail-gallery__item" aria-label="Voir l’image">
            <img src="{{MINIATURA}}" data-full-image="{{IMAGEN}}" alt="Image du produit" loading="lazy" />
        </button>
        {{/IMAGENES}}
    </div>
    <div class="product-detail-brand">MARQUE : {{MARCA}}</div>
    <div class="product-detail-price">PRIX : {{PRECIO}} €</div>
    <div class="product-detail-attributes">COULEUR : {{COLOR}} | POINTURE : {{TALLA}}</div>
    <p class="product-detail-description">DESCRIPTION : {{DESCRIPCION}}</p>
    <div class="product-detail-actions">
        <label>QUANTITÉ : <input type="number" value="1" min="1"></label>
        <a href="#" class="btn-cart" onclick="agregarProductoCarrito({{ID}}, this.parentElement.querySelector('input[type=number]').value); return false;">AJOUTER AU PANIER</a>
    </div>
</article>
