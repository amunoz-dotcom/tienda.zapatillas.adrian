<div class="product-grid">
    {{#.}}
    <div class="product-card">
        <div>CATEGORY: {{CATEGORIA}}</div>
        <strong>MODEL: {{MODELO}}</strong>
        <img class="imagen-producto" src="mostrar_miniatura?id={{ID}}" alt="Image of {{MODELO}}" loading="lazy" />
        <div>BRAND: {{MARCA}}</div>
        <div>PRICE: {{PRECIO}} €</div>
        <div>COLOR: {{COLOR}}</div>
        <div>SIZE: {{TALLA}}</div>
        {{#DESCRIPCION}}
        <div>DESCRIPTION: {{DESCRIPCION}}</div>
        {{/DESCRIPCION}}
        {{#SKU}}
        <div>SKU: {{SKU}}</div>
        {{/SKU}}
        <a href="#" class="btn-details" onclick="mostrar_detalles({{ID}}); return false;">VIEW DETAILS</a>
        <div style="margin-top: 6px;">
            <label>QUANTITY:</label>
            <input type="number" value="1" min="1">
        </div>
        <a href="#" class="btn-cart" onclick="agregarProductoCarrito({{ID}}, this.closest('.product-card').querySelector('input[type=number]').value); return false;">ADD TO CART</a>
    </div>
    {{/.}}
</div>
