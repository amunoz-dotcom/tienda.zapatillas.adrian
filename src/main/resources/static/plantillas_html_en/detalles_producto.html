<article class="product-detail-card">
    <div class="product-detail-category">CATEGORY: {{CATEGORIA}}</div>
    <h2>MODEL: {{MODELO}}</h2>
    <div class="product-detail-image">
        <img class="imagen-producto product-detail-image__main" src="mostrar_imagen?id={{ID}}" alt="Image of {{MODELO}}" />
    </div>
    <div class="product-detail-gallery" role="group" aria-label="Product image gallery">
        {{#IMAGENES}}
        <button type="button" class="product-detail-gallery__item" aria-label="View image">
            <img src="{{MINIATURA}}" data-full-image="{{IMAGEN}}" alt="Product image" loading="lazy" />
        </button>
        {{/IMAGENES}}
    </div>
    <div class="product-detail-brand">BRAND: {{MARCA}}</div>
    <div class="product-detail-price">PRICE: {{PRECIO}} €</div>
    <div class="product-detail-attributes">COLOR: {{COLOR}} | SIZE: {{TALLA}}</div>
    <p class="product-detail-description">DESCRIPTION: {{DESCRIPCION}}</p>
    <div class="product-detail-actions">
        <label>QUANTITY: <input type="number" value="1" min="1"></label>
        <a href="#" class="btn-cart" onclick="agregarProductoCarrito({{ID}}, this.parentElement.querySelector('input[type=number]').value); return false;">ADD TO CART</a>
    </div>
</article>
