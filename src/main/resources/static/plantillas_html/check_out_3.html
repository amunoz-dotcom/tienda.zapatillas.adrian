<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Preferencias</title>
</head>
<body>

<div>REALIZAR PEDIDO - PREFERENCIAS SNEAKER</div>
<div>Personaliza las opciones de tu pedido</div>

<br>

<label for="campo_regalo">Regalo por compra:</label><br>
<select id="campo_regalo" class="border">
    <option value="Spray protector de zapatillas">Spray protector impermeable</option>
    <option value="Kit de limpieza de zapatillas">Kit de limpieza express</option>
    <option value="Cordones extra (Blancos y Negros)">Set de cordones extra</option>
</select><br><br>

<label for="campo_embalaje">Tipo de embalaje:</label><br>
<select id="campo_embalaje" class="border">
    <option value="Caja doble reforzada para coleccionistas">Caja doble reforzada (Coleccionistas)</option>
    <option value="Embalaje ecológico sin plástico">Embalaje 100% ecológico reciclado</option>
</select><br><br>

<label for="campo_talla_calcetines">Talla para calcetines de regalo:</label><br>
<select id="campo_talla_calcetines" class="border">
    <option value="S (35-38)">S (35-38)</option>
    <option value="M (39-42)">M (39-42)</option>
    <option value="L (43-46)">L (43-46)</option>
</select><br><br>

<button style="padding: 10px" id="aceptar_paso_preferencias" class="bg-blue-200">CONTINUAR AL PAGO</button>

</body>
</html>
