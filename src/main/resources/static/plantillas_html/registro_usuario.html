<div>
    introduce tus datos para registrarte<br/>
    <form id="form_registro_usuario">
        <label for="nombre">nombre:</label>
        <input type="text" id="nombre" name="nombre" class="border"><br/>

        <label for="email">email:</label>
        <input type="email" id="email" name="email" class="border"><br/>

        <label for="pass">pass:</label>
        <input type="password" id="pass" name="pass" class="border"><br/>

        <label for="direccion">dirección:</label>
        <input type="text" id="direccion" name="direccion" class="border"><br/>

        <label for="puesto">puesto:</label>
        <input type="text" id="puesto" name="puesto" class="border"><br/>

        <label for="salario">salario:</label>
        <input type="number" step="0.01" id="salario" name="salario" class="border"><br/><br/>

        <button type="submit" class="bg-blue-200">Registrarse</button>
    </form>

    <!-- Mensaje de respuesta del servidor -->
    <div id="mensaje_respuesta"></div>
</div>
