spring.application.name=tienda.online
spring.datasource.url=jdbc:h2:file:./data/base_de_datos
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.platform=h2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto = update
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.product-images.directory=./data/imagenes-productos
app.product-images.min-width=300
app.product-images.min-height=300
app.product-images.max-width=4000
app.product-images.max-height=4000
app.product-images.max-file-size=10485760
app.product-images.max-width-output=1200
app.product-images.max-height-output=1200
app.product-images.thumbnail-max-width=300
app.product-images.thumbnail-max-height=300