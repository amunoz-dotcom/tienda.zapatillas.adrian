<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{admin.categories.title}">Categorías</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:insert="~{fragments/general.html :: menu}"></div>
<main class="admin-page">
    <h1 class="admin-page__title" th:text="#{admin.categories.title}">Categorías</h1>
    <div class="admin-page__toolbar">
        <a class="admin-page__button" th:href="@{/admin/registrarCategoria}" th:text="#{admin.categories.create}">Nueva categoría</a>
    </div>
    <div class="admin-page__list">
        <article class="admin-page__card" th:each="c : ${categorias}">
            <h2 th:text="${c.nombre}"></h2>
            <p><strong th:text="#{admin.description} + ':'">Descripción:</strong> <span th:text="${c.descripcion}"></span></p>
            <a class="admin-page__button admin-page__button--secondary"
               th:href="@{/admin/editarCategoria(id=${c.id})}" th:text="#{admin.edit}">Editar</a>
            <a class="admin-page__button" th:href="@{/admin/borrarCategoria(id=${c.id})}"
               th:attr="data-confirm=#{admin.confirm.delete}" onclick="return confirm(this.dataset.confirm)"
               th:text="#{admin.delete}">Eliminar</a>
        </article>
    </div>
    <p class="admin-page__empty" th:if="${categorias.isEmpty()}" th:text="#{admin.categories.empty}">No hay categorías registradas.</p>
    <nav class="admin-page__pagination" th:if="${pagina.totalPages > 1}" th:aria-label="#{admin.categories.title}">
        <a th:if="${pagina.hasPrevious()}" th:href="@{/admin/gestionarCategorias(pagina=${pagina.number - 1})}"
           th:text="#{admin.previous}">Anterior</a>
        <span th:text="#{admin.page(${pagina.number + 1},${pagina.totalPages})}">Página</span>
        <a th:if="${pagina.hasNext()}" th:href="@{/admin/gestionarCategorias(pagina=${pagina.number + 1})}"
           th:text="#{admin.next}">Siguiente</a>
    </nav>
</main>
</body>
</html>
