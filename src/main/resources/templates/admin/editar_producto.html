<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{admin.form.product.edit}">Editar zapatilla</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:insert="~{fragments/general.html :: menu}"></div>
<main class="admin-page">
    <h1 class="admin-page__title" th:text="#{admin.form.product.edit}">Editar zapatilla</h1>
    <form class="admin-page__form" th:action="@{/admin/guardarCambiosZapatilla}" th:object="${zapatillaEditar}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" name="idZapatilla" th:value="${zapatillaEditar.id}">
        <p class="image-upload-error" th:if="${errorImagen}" th:text="${errorImagen}" role="alert"></p>
        <label for="modelo" th:text="#{admin.model}">Modelo</label>
        <input type="text" id="modelo" th:field="*{modelo}" required>
        <span th:if="${#fields.hasErrors('modelo')}" th:errors="*{modelo}" style="color:red"></span>
        <label for="idCategoria" th:text="#{admin.form.category}">Categoría</label>
        <select id="idCategoria" th:field="*{idCategoria}" required>
            <option th:each="c : ${categorias}" th:text="${c.nombre}" th:value="${c.id}"></option>
        </select>
        <label for="marca" th:text="#{admin.brand.label}">Marca</label>
        <input type="text" id="marca" th:field="*{marca}">
        <label for="precio" th:text="#{admin.price} + ' (€)'">Precio (€)</label>
        <input type="number" id="precio" th:field="*{precio}" min="1" max="99999" step="0.01" required>
        <span th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}" style="color:red"></span>
        <label for="color" th:text="#{admin.color}">Color</label>
        <input type="text" id="color" th:field="*{color}">
        <label for="talla" th:text="#{admin.size}">Talla</label>
        <input type="number" id="talla" th:field="*{talla}" min="1" step="0.5">
        <label for="descripcion" th:text="#{admin.description}">Descripción</label>
        <textarea id="descripcion" th:field="*{descripcion}"></textarea>
        <fieldset class="product-image-fieldset">
            <legend>Imágenes actuales — selecciona la portada</legend>
            <div class="product-image-previews">
                <article class="product-image-preview" th:if="${imagenLegada}">
                    <img th:src="@{/mostrar_imagen(id=${zapatillaEditar.id})}" th:alt="${zapatillaEditar.modelo}" loading="lazy">
                    <label><input type="radio" name="imagenPrincipal" value="legacy"
                                  th:checked="${imagenLegadaPrincipal}"> Imagen principal</label>
                    <button type="submit" name="imagen" value="legacy" th:formaction="@{/admin/eliminarImagenZapatilla}"
                            formmethod="post" formnovalidate>Eliminar</button>
                </article>
                <article class="product-image-preview" th:each="imagen : ${imagenesActuales}">
                    <img th:src="@{/miniaturas-producto/{id}(id=${imagen.id})}" th:alt="${zapatillaEditar.modelo}" loading="lazy">
                    <label><input type="radio" name="imagenPrincipal" th:value="|existing:${imagen.id}|"
                                  th:checked="${imagen.principal}"> Imagen principal</label>
                    <button type="submit" name="imagen" th:value="|${imagen.id}|"
                            th:formaction="@{/admin/eliminarImagenZapatilla}" formmethod="post" formnovalidate>Eliminar</button>
                </article>
            </div>
        </fieldset>
        <label for="imagenes">Añadir imágenes</label>
        <input type="file" id="imagenes" name="imagenes" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" multiple>
        <p class="image-upload-hint" th:text="|JPEG, JPG, PNG o WEBP. De ${imagenMinAncho} × ${imagenMinAlto} a ${imagenMaxAncho} × ${imagenMaxAlto} píxeles; máximo ${imagenMaxPesoMb} MB por imagen.|"></p>
        <div class="product-image-previews" id="nuevas-imagenes-preview"
             th:attr="data-current-cover=${imagenPrincipalActual}"></div>
        <button type="submit" th:text="#{admin.form.update}">Actualizar</button>
    </form>
    <a class="admin-page__back" th:href="@{/admin/gestionarZapatillas}" th:text="#{admin.form.back}">Volver al listado</a>
</main>
<script th:src="@{/js/galeria-admin.js}" defer></script>
</body>
</html>
