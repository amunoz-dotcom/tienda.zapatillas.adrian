<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{admin.products.title}">Gestión de zapatillas</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:insert="~{fragments/general.html :: menu}"></div>
<main class="admin-page">
    <h1 class="admin-page__title" th:text="#{admin.products.title}">Gestión de zapatillas</h1>
    <div class="admin-page__toolbar">
        <a class="admin-page__button" th:href="@{/admin/registrarZapatilla}" th:text="#{admin.products.create}">Nueva zapatilla</a>
    </div>
    <div class="admin-page__toolbar">
        <form th:action="@{/admin/gestionarZapatillas}" method="get">
            <label for="busqueda" th:text="#{admin.products.search}">Buscar zapatillas</label>
            <input id="busqueda" type="search" name="busqueda" th:value="${busqueda}" th:placeholder="#{admin.products.search.placeholder}">
            <button type="submit" th:text="#{admin.search}">Buscar</button>
            <a class="admin-page__button admin-page__button--secondary" th:if="${!busqueda.isEmpty()}"
               th:href="@{/admin/gestionarZapatillas}" th:text="#{admin.clear}">Limpiar</a>
        </form>
        <span><span th:text="#{admin.results}">Resultados</span>: <strong th:text="${pagina.totalElements}"></strong></span>
    </div>
    <div class="admin-page__list admin-products-list">
        <article class="admin-page__card" th:each="v : ${zapatillas}">
            <h2 th:text="${v.modelo}"></h2>
            <img class="admin-product-image" th:src="@{/mostrar_miniatura(id=${v.id})}" th:alt="${v.modelo}" loading="lazy">
            <p><strong th:text="#{admin.brand.label} + ':'">Marca:</strong> <span th:text="${v.marca}"></span></p>
            <p><strong th:text="#{admin.price} + ':'">Precio:</strong> <span th:text="|${v.precio} €|"></span></p>
            <p><strong th:text="#{admin.description} + ':'">Descripción:</strong> <span th:text="${v.descripcion}"></span></p>
            <p><strong th:text="#{admin.size} + ':'">Talla:</strong> <span th:text="${v.talla}"></span></p>
            <p><strong th:text="#{admin.color} + ':'">Color:</strong> <span th:text="${v.color}"></span></p>
            <a class="admin-page__button admin-page__button--secondary"
               th:href="@{/admin/editarZapatilla(id=${v.id})}" th:text="#{admin.edit}">Editar</a>
            <a class="admin-page__button" th:href="@{/admin/borrarZapatilla(id=${v.id})}"
               th:attr="data-confirm=#{admin.confirm.delete}" onclick="return confirm(this.dataset.confirm)"
               th:text="#{admin.delete}">Eliminar</a>
        </article>
    </div>
    <p class="admin-page__empty" th:if="${zapatillas.isEmpty()}" th:text="#{admin.products.empty}">No se encontraron zapatillas.</p>
    <nav class="admin-page__pagination" th:if="${pagina.totalPages > 1}" th:aria-label="#{admin.products.title}">
        <a th:if="${pagina.hasPrevious()}"
           th:href="@{/admin/gestionarZapatillas(pagina=${pagina.number - 1}, busqueda=${busqueda})}"
           th:text="#{admin.previous}">Anterior</a>
        <span th:text="#{admin.page(${pagina.number + 1},${pagina.totalPages})}">Página</span>
        <a th:if="${pagina.hasNext()}"
           th:href="@{/admin/gestionarZapatillas(pagina=${pagina.number + 1}, busqueda=${busqueda})}"
           th:text="#{admin.next}">Siguiente</a>
    </nav>
</main>
</body>
</html>
